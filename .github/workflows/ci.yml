name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    name: Server tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (no GPU, no model)
        run: python -m pytest tests/ --ignore=tests/test_kernel.py -v

  dotnet-build:
    name: Mod build (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod/P5RGenSocialLinks

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

  dotnet-tests:
    name: Mod tests (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod/P5RGenSocialLinks.Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The test project links the parser sources rather than referencing the mod, so it
      # carries no Reloaded or Win32 dependency and runs on the Linux runner unchanged.
      - name: Run tests
        run: dotnet test -v minimal
